# Eight-GPU tuned example: native.
output = "artifacts/pi05-native"

[model]
name = "pi05"
path = "data/models/pi05_libero_base"
dataset = "data/libero_molmo"
train_expert_only = true
freeze_vision_encoder = true
dtype = "bfloat16"
compile_model = true

[parallel]
dp_replicate = 1
dp_shard = 8
ac = "full"
reshard = "default"
retain_frozen = false
skip_unused_logits = true
structured_attention = false

[training]
steps = 30000
microbatch = 8
global_batch = 64
workers = 8
preprocess_in_workers = false
seed = 42
lr = 2.5e-05
weight_decay = 0.01
betas = [0.9, 0.95]
eps = 1e-08
warmup_steps = 1000
clip_grad = 1.0
precision = "bfloat16"
optimizer = "for-loop"
warmup_measurement = 5
max_seconds = 7080
